<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Task Manager With Filters</title>
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding: 40px 20px;
      margin: 0;
    }
    .container {
      max-width: 900px;
      margin: 0 auto;
      background: white;
      padding: 40px;
      border-radius: 20px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
    }
    h1 {
      text-align: center;
      color: #667eea;
      margin-bottom: 30px;
    }
    .filter-section {
      background: #f5f5f5;
      padding: 20px;
      border-radius: 15px;
      margin-bottom: 30px;
    }
    label {
      font-weight: bold;
      margin-right: 10px;
      color: #555;
    }
    select {
      padding: 10px 15px;
      border: 2px solid #ddd;
      border-radius: 8px;
      font-size: 14px;
      cursor: pointer;
      min-width: 200px;
    }
    select:focus {
      outline: none;
      border-color: #667eea;
    }
    .loading {
      text-align: center;
      padding: 40px;
      color: #667eea;
      font-size: 18px;
    }
    .tasks {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }
    .task {
      background: #f9f9f9;
      padding: 20px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      gap: 15px;
      transition: all 0.3s;
      border-left: 4px solid transparent;
    }
    .task:hover {
      transform: translateX(5px);
      box-shadow: 0 3px 10px rgba(0,0,0,0.1);
    }
    .task.low {
      border-left-color: #4caf50;
    }
    .task.medium {
      border-left-color: #ff9800;
    }
    .task.high {
      border-left-color: #f44336;
    }
    .task.completed {
      background: #e8f5e9;
      opacity: 0.7;
    }
    .task-checkbox {
      width: 20px;
      height: 20px;
      cursor: pointer;
    }
    .task-content {
      flex: 1;
    }
    .task-title {
      font-size: 18px;
      font-weight: bold;
      color: #333;
      margin-bottom: 5px;
    }
    .task.completed .task-title {
      text-decoration: line-through;
      color: #999;
    }
    .task-priority {
      display: inline-block;
      padding: 4px 12px;
      border-radius: 15px;
      font-size: 11px;
      font-weight: bold;
      text-transform: uppercase;
      color: white;
    }
    .task-priority.low {
      background: #4caf50;
    }
    .task-priority.medium {
      background: #ff9800;
    }
    .task-priority.high {
      background: #f44336;
    }
    .no-tasks {
      text-align: center;
      padding: 40px;
      color: #999;
      font-size: 18px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>✅ Task Manager</h1>
    
    <div class="filter-section">
      <label for="filterSelect">Filter by:</label>
      <select id="filterSelect">
        <option value="all">All Tasks</option>
        <option value="low">Low Priority</option>
        <option value="medium">Medium Priority</option>
        <option value="high">High Priority</option>
        <option value="completed">Completed</option>
      </select>
    </div>

    <div class="loading" id="loading">Loading tasks...</div>
    <div class="tasks" id="tasks"></div>
    <div class="no-tasks" id="noTasks" style="display: none;">
      No tasks found
    </div>
  </div>

  <script src="task-manager.js"></script>
</body>
</html>
