<body>
  <header><h1>Q2 — CSS Tooltips</h1><p>Tooltips built with pure CSS (positioning + opacity transitions).</p></header>
  <main>
    <section class="wrap">
      <div class="tip">Hover me

        <span class="tooltip">Positioned above the element</span>
      </div>
    </section>
  </main>
