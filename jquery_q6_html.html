<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Event Subscription Panel</title>
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding: 40px 20px;
      margin: 0;
    }
    .container {
      max-width: 800px;
      margin: 0 auto;
      background: white;
      padding: 40px;
      border-radius: 20px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
    }
    h1 {
      text-align: center;
      color: #667eea;
      margin-bottom: 30px;
    }
    .subscription-form {
      background: #f5f5f5;
      padding: 25px;
      border-radius: 15px;
      margin-bottom: 30px;
    }
    .form-group {
      margin-bottom: 20px;
    }
    label {
      display: block;
      font-weight: bold;
      margin-bottom: 5px;
      color: #555;
    }
    input {
      width: 100%;
      padding: 12px;
      border: 2px solid #ddd;
      border-radius: 8px;
      font-size: 14px;
      box-sizing: border-box;
    }
    input:focus {
      outline: none;
      border-color: #667eea;
    }
    .btn {
      padding: 12px 25px;
      margin: 5px;
      font-size: 16px;
      font-weight: bold;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.3s;
      color: white;
    }
    .btn-subscribe {
      background: linear-gradient(135deg, #43e97b 0%, #38f9d7 100%);
    }
    .btn-unsubscribe {
      background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
    }
    .btn-remove {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    }
    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(0,0,0,0.3);
    }
    .subscriptions {
      margin-top: 30px;
    }
    .subscription-item {
      background: white;
      border: 2px solid #e0e0e0;
      padding: 20px;
      border-radius: 10px;
      margin-bottom: 15px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: all 0.3s;
    }
    .subscription-item.enabled {
      border-color: #43e97b;
      background: #e8f5e9;
    }
    .subscription-item.disabled {
      border-color: #f44336;
      background: #ffebee;
    }
    .sub-info {
      flex: 1;
    }
    .sub-name {
      font-size: 18px;
      font-weight: bold;
      color: #333;
      margin-bottom: 5px;
    }
    .sub-status {
      font-size: 14px;
      color: #666;
    }
    .sub-actions {
      display: flex;
      gap: 10px;
    }
    .success-message {
      background: #e8f5e9;
      color: #2e7d32;
      padding: 15px;
      border-radius: 8px;
      margin-top: 20px;
      text-align: center;
      display: none;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🔔 Event Subscription Panel</h1>
    
    <div class="subscription-form">
      <h3>Add New Subscription</h3>
      <div class="form-group">
        <label for="topicName">Topic Name</label>
        <input type="text" id="topicName" placeholder="Enter topic name">
      </div>
      <button class="btn btn-subscribe" id="addTopicBtn">Add Topic</button>
    </div>

    <div class="subscriptions">
      <h3>Your Subscriptions</h3>
      
      <div class="subscription-item enabled" data-topic="newsletter">
        <div class="sub-info">
          <div class="sub-name">Weekly Newsletter</div>
          <div class="sub-status">Status: Enabled</div>
        </div>
        <div class="sub-actions">
          <button class="btn btn-unsubscribe" data-action="toggle">Unsubscribe</button>
          <button class="btn btn-remove" data-action="remove">Remove</button>
        </div>
      </div>

      <div class="subscription-item enabled" data-topic="updates">
        <div class="sub-info">
          <div class="sub-name">Product Updates</div>
          <div class="sub-status">Status: Enabled</div>
        </div>
        <div class="sub-actions">
          <button class="btn btn-unsubscribe" data-action="toggle">Unsubscribe</button>
          <button class="btn btn-remove" data-action="remove">Remove</button>
        </div>
      </div>

      <div class="subscription-item enabled" data-topic="events">
        <div class="sub-info">
          <div class="sub-name">Event Notifications</div>
          <div class="sub-status">Status: Enabled</div>
        </div>
        <div class="sub-actions">
          <button class="btn btn-unsubscribe" data-action="toggle">Unsubscribe</button>
          <button class="btn btn-remove" data-action="remove">Remove</button>
        </div>
      </div>
    </div>

    <div class="success-message" id="successMsg"></div>
  </div>

  <script src="subscription.js"></script>
</body>
</html>
