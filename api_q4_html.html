<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Multi-API Dashboard</title>
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding: 40px 20px;
      margin: 0;
    }
    .container {
      max-width: 1200px;
      margin: 0 auto;
    }
    h1 {
      text-align: center;
      color: white;
      margin-bottom: 40px;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
    }
    .loading {
      text-align: center;
      padding: 40px;
      color: white;
      font-size: 24px;
    }
    .loading::after {
      content: '...';
      animation: dots 1.5s infinite;
    }
    @keyframes dots {
      0%, 20% { content: '.'; }
      40% { content: '..'; }
      60%, 100% { content: '...'; }
    }
    .dashboard {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 30px;
    }
    .stat-card {
      background: white;
      padding: 40px;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.3);
      text-align: center;
      transition: all 0.3s;
    }
    .stat-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 15px 40px rgba(0,0,0,0.4);
    }
    .stat-icon {
      font-size: 60px;
      margin-bottom: 20px;
    }
    .stat-value {
      font-size: 48px;
      font-weight: bold;
      color: #667eea;
      margin-bottom: 10px;
    }
    .stat-label {
      font-size: 18px;
      color: #666;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .error {
      background: white;
      padding: 40px;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.3);
      text-align: center;
      color: #f44336;
      font-size: 18px;
    }
    .skeleton {
      background: linear-gradient(90deg, #f0f0f0 25%, #e0e0e0 50%, #f0f0f0 75%);
      background-size: 200% 100%;
      animation: loading 1.5s infinite;
      border-radius: 10px;
    }
    @keyframes loading {
      0% { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }
    .skeleton-icon {
      width: 60px;
      height: 60px;
      margin: 0 auto 20px;
    }
    .skeleton-value {
      height: 48px;
      width: 120px;
      margin: 0 auto 10px;
    }
    .skeleton-label {
      height: 20px;
      width: 150px;
      margin: 0 auto;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>📊 Multi-API Dashboard</h1>
    
    <div class="loading" id="loading">Loading dashboard data</div>
    
    <div class="dashboard" id="dashboard" style="display: none;">
      <div class="stat-card">
        <div class="stat-icon">👥</div>
        <div class="stat-value" id="totalUsers">-</div>
        <div class="stat-label">Total Users</div>
      </div>

      <div class="stat-card">
        <div class="stat-icon">📦</div>
        <div class="stat-value" id="totalOrders">-</div>
        <div class="stat-label">Total Orders</div>
      </div>

      <div class="stat-card">
        <div class="stat-icon">🛍️</div>
        <div class="stat-value" id="totalProducts">-</div>
        <div class="stat-label">Total Products</div>
      </div>
    </div>

    <div class="error" id="error" style="display: none;"></div>
  </div>

  <script src="multi-api-dashboard.js"></script>
</body>
</html>
