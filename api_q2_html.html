<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Employee Status Dashboard</title>
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      padding: 40px 20px;
      margin: 0;
    }
    .container {
      max-width: 1200px;
      margin: 0 auto;
    }
    h1 {
      text-align: center;
      color: #333;
      margin-bottom: 40px;
    }
    .loading {
      text-align: center;
      padding: 40px;
      font-size: 20px;
      color: #667eea;
    }
    .employees {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 25px;
    }
    .employee {
      background: white;
      padding: 25px;
      border-radius: 15px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      transition: all 0.3s;
    }
    .employee:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 20px rgba(0,0,0,0.15);
    }
    .employee-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
    }
    .employee-id {
      font-size: 14px;
      color: #999;
      font-weight: bold;
    }
    .employee-name {
      font-size: 22px;
      font-weight: bold;
      color: #333;
      margin-bottom: 10px;
    }
    .employee-info {
      font-size: 14px;
      color: #666;
      margin-bottom: 15px;
    }
    .status-badge {
      display: inline-block;
      padding: 6px 15px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: bold;
      text-transform: uppercase;
    }
    .status-badge.active {
      background: #4caf50;
      color: white;
    }
    .status-badge.inactive {
      background: #f44336;
      color: white;
    }
    .toggle-btn {
      width: 100%;
      padding: 12px;
      margin-top: 15px;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.3s;
      color: white;
    }
    .toggle-btn.active {
      background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
    }
    .toggle-btn.inactive {
      background: linear-gradient(135deg, #43e97b 0%, #38f9d7 100%);
    }
    .toggle-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(0,0,0,0.3);
    }
    .error {
      text-align: center;
      padding: 40px;
      color: #f44336;
      font-size: 18px;
      background: white;
      border-radius: 15px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>👥 Employee Status Dashboard</h1>
    
    <div class="loading" id="loading">Loading employees...</div>
    <div class="employees" id="employees"></div>
    <div class="error" id="error" style="display: none;"></div>
  </div>

  <script src="employee-dashboard.js"></script>
</body>
</html>
