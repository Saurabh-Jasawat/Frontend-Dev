<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Real-Time Live Search</title>
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding: 40px 20px;
      margin: 0;
    }
    .container {
      max-width: 800px;
      margin: 0 auto;
      background: white;
      padding: 40px;
      border-radius: 20px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
    }
    h1 {
      text-align: center;
      color: #667eea;
      margin-bottom: 30px;
    }
    .search-box {
      position: relative;
      margin-bottom: 30px;
    }
    #searchInput {
      width: 100%;
      padding: 15px 20px;
      border: 2px solid #ddd;
      border-radius: 10px;
      font-size: 16px;
      box-sizing: border-box;
    }
    #searchInput:focus {
      outline: none;
      border-color: #667eea;
    }
    .loading {
      text-align: center;
      padding: 20px;
      color: #667eea;
      font-size: 18px;
      display: none;
    }
    .loading::after {
      content: '...';
      animation: dots 1.5s infinite;
    }
    @keyframes dots {
      0%, 20% { content: '.'; }
      40% { content: '..'; }
      60%, 100% { content: '...'; }
    }
    .results {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 20px;
    }
    .product {
      background: #f9f9f9;
      padding: 20px;
      border-radius: 10px;
      text-align: center;
      transition: all 0.3s;
      border: 2px solid transparent;
    }
    .product:hover {
      transform: translateY(-5px);
      box-shadow: 0 5px 15px rgba(0,0,0,0.2);
      border-color: #667eea;
    }
    .product-image {
      width: 100%;
      height: 150px;
      background: #e0e0e0;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 48px;
      margin-bottom: 15px;
    }
    .product-name {
      font-size: 16px;
      font-weight: bold;
      color: #333;
      margin-bottom: 10px;
    }
    .product-price {
      font-size: 20px;
      color: #4caf50;
      font-weight: bold;
    }
    .no-results {
      text-align: center;
      padding: 40px;
      color: #999;
      font-size: 18px;
      display: none;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🔍 Real-Time Product Search</h1>
    
    <div class="search-box">
      <input type="text" id="searchInput" placeholder="Search for products...">
    </div>

    <div class="loading" id="loading">Loading</div>
    
    <div class="results" id="results"></div>
    
    <div class="no-results" id="noResults">
      No products found
    </div>
  </div>

  <script src="live-search.js"></script>
</body>
</html>
